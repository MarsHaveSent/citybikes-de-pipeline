name: citybikes

x-airflow-common: &airflow-common
  build: docker/airflow
  image: citybikes/airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@postgres:5432/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_CITYBIKES_DB: postgresql://citybikes:${CITYBIKES_DB_PASSWORD:?}@postgres:5432/citybikes
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    AIRFLOW_CONN_CITYBIKES_CLICKHOUSE: clickhouse://citybikes:${CLICKHOUSE_PASSWORD:?}@clickhouse:8123/citybikes
    HADOOP_USER_NAME: citybikes
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./sql:/opt/airflow/sql:ro
    - ./spark_jobs:/opt/airflow/spark_jobs:ro
    - ./docker/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

x-hadoop-common: &hadoop-common
  build: docker/hadoop
  image: citybikes/hadoop:3.5.0
  environment: &hadoop-common-env
    CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
    HDFS-SITE.XML_dfs.replication: "1"
    HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
    HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
    HADOOP_HEAPSIZE_MAX: 256m

x-spark-common: &spark-common
  build: docker/spark
  image: citybikes/spark:4.1.1

services:
  postgres:
    # Точная версия и ОС образа
    image: postgres:17.11-trixie
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      CITYBIKES_DB_PASSWORD: ${CITYBIKES_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  namenode:
    <<: *hadoop-common
    hostname: namenode
    command: ["hdfs", "namenode"]
    environment:
      <<: *hadoop-common-env
      # Форматирует NameNode при первом запуске, если каталога метаданных ещё нет
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
    volumes:
      - hdfs-namenode:/hadoop/dfs
    ports:
      - "127.0.0.1:9870:9870"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9870/"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  datanode:
    <<: *hadoop-common
    command: ["hdfs", "datanode"]
    volumes:
      - hdfs-datanode:/hadoop/dfs
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9864/"]
      interval: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    depends_on:
      namenode:
        condition: service_healthy

  # Каталог проекта в HDFS принадлежит пользователю, от имени которого пишет Spark
  hdfs-init:
    <<: *hadoop-common
    command:
      - bash
      - -c
      - hdfs dfs -mkdir -p /citybikes && hdfs dfs -chown citybikes /citybikes
    depends_on:
      datanode:
        condition: service_healthy

  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: spark-class org.apache.spark.deploy.master.Master --host spark-master
    environment:
      SPARK_DAEMON_MEMORY: 256m
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080')"]
      interval: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  spark-worker:
    <<: *spark-common
    command: spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 1g
      SPARK_DAEMON_MEMORY: 256m
      HADOOP_USER_NAME: citybikes
    ports:
      - "127.0.0.1:8082:8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8081')"]
      interval: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:26.8.32.14
    environment:
      CLICKHOUSE_DB: citybikes
      CLICKHOUSE_USER: citybikes
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      # Пользователь сможет создавать других пользователей SQL-командами
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
  hdfs-namenode:
  hdfs-datanode:
  clickhouse-data:
