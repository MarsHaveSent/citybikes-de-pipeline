name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет незавершённый прогон
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # У setup-uv нет мажорных тегов вроде v10, только точные версии
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      # падает если uv.lock не соответствует pyproject.toml
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v

  dags:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker/airflow
          tags: citybikes/airflow:3.3.2
          load: true
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max
      - name: Validate compose file
        run: |
          python3 scripts/init_env.py
          docker compose config --quiet
      # DAGи с теми же томами и переменными что в compose
      - name: Check DAGs
        run: >-
          docker compose run --rm --no-deps
          -e CONNECTION_CHECK_MAX_COUNT=0
          -v ./scripts:/opt/airflow/scripts:ro
          airflow-scheduler python /opt/airflow/scripts/check_dags.py
