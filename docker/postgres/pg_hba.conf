# Кто может подключаться к Postgres. Правила проверяются сверху вниз, первое совпавшее решает.

# TYPE  DATABASE   USER       ADDRESS               METHOD
local   all        all                              trust
host    all        all        127.0.0.1/32          trust
# Контейнеры из сети compose и хост через 127.0.0.1:15432 (Docker подменяет адрес на шлюз сети)
host    all        all        samenet               scram-sha-256

# Yandex DataLens: только пользователь datalens, только база citybikes, только TLS.
# Адреса DataLens: https://yandex.cloud/ru/docs/datalens/operations/connection/create-postgresql
# (178.154.242.128-223 и 130.193.60.0-31). Те же диапазоны в deploy/firewall.sh
hostssl citybikes  datalens   178.154.242.128/26    scram-sha-256
hostssl citybikes  datalens   178.154.242.192/27    scram-sha-256
hostssl citybikes  datalens   130.193.60.0/27       scram-sha-256
