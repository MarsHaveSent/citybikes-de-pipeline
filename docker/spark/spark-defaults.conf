# Настройки драйвера: монтируются в контейнеры Airflow, откуда идёт spark-submit

spark.master                     spark://spark-master:7077
spark.hadoop.fs.defaultFS        hdfs://namenode:8020
# Число реплик задаёт клиент при записи, настройка NameNode тут не действует.
# По умолчанию 3, а DataNode одна - блоки навсегда остались бы недореплицированными.
spark.hadoop.dfs.replication     1

# Задачи Airflow (LocalExecutor) выполняются в контейнере scheduler. Executor'ы
# подключаются к драйверу обратно, поэтому ему нужен адрес, видимый в сети compose.
spark.driver.host                airflow-scheduler
spark.driver.bindAddress         0.0.0.0

spark.driver.memory              512m
spark.executor.memory            1g
spark.executor.cores             2
spark.sql.session.timeZone       UTC
